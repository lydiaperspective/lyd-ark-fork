name: Build Lyd Ark KDE Installer ISO

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: lyd-ark-iso-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-releases:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      aur-release-id: ${{ steps.aur.outputs.release-id }}
      alga-url: ${{ steps.alga.outputs.url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check published ark-aur release
        id: aur
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/workflows/download-aur-release.py --kind identity
      - name: Wait for current Alga package release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXPECTED=$(gh api repos/lydiaperspective/lyd-agka/commits/main --jq '.sha')
          STATE=pending
          for attempt in $(seq 1 60); do
            RUN=$(gh api 'repos/lydiaperspective/lyd-agka/actions/workflows/release.yml/runs?branch=main&per_page=1')
            RUN_SHA=$(printf '%s' "$RUN" | jq -r '.workflow_runs[0].head_sha // empty')
            STATE=$(printf '%s' "$RUN" | jq -r '.workflow_runs[0] | if .status == "completed" then .conclusion else .status end')
            if [ "$RUN_SHA" = "$EXPECTED" ] && [ "$STATE" = success ]; then
              echo "Current Alga commit $EXPECTED has a published package."
              break
            fi
            if [ "$RUN_SHA" = "$EXPECTED" ] && [[ "$STATE" =~ ^(failure|cancelled|timed_out|action_required|stale)$ ]]; then
              echo "Alga package build failed: $STATE" >&2
              exit 1
            fi
            echo "Waiting for Alga package build ($attempt/60): run=$RUN_SHA state=$STATE expected=$EXPECTED"
            sleep 30
          done
          [ "$RUN_SHA" = "$EXPECTED" ] && [ "$STATE" = success ] || {
            echo "Timed out waiting for the latest Alga package build." >&2
            exit 1
          }
      - name: Check published Alga fork release
        id: alga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATA=$(gh api repos/lydiaperspective/lyd-agka/releases/latest)
          ID=$(printf '%s' "$DATA" | jq -er '.id')
          URL=$(printf '%s' "$DATA" | jq -er '[.assets[] | select(.name | endswith(".pkg.tar.zst")) | select(.name | contains("-debug-") | not)] | if length == 1 then .[0].browser_download_url else error("Expected exactly one Alga package asset") end')
          echo "release-id=$ID" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  build-iso:
    needs: check-releases
    outputs:
      is-split: ${{ steps.package-iso.outputs.is-split }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y podman wget curl jq gh

      - name: Pull latest published desktop base image
        run: |
          sudo podman pull ghcr.io/lydiaperspective/lyd-ark-image:base-desktop

      - name: Download AUR packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/workflows/download-aur-release.py --kind packages \
            --release-id '${{ needs.check-releases.outputs.aur-release-id }}' \
            --destination aur-packages

      - name: Download Alga installer package
        env:
          PACKAGE_URL: ${{ needs.check-releases.outputs.alga-url }}
        run: curl -fL --retry 3 --connect-timeout 15 --max-time 300 "$PACKAGE_URL" -o aur-packages/alga.pkg.tar.zst

      - name: Download ark-backgrounds package
        run: |
          cd aur-packages
          python3 << 'PY' | wget -qi -
          import json
          import urllib.request
          req = urllib.request.Request(
              "https://api.github.com/repos/zamkara/ark-backgrounds/releases/latest",
              headers={"User-Agent": "Lyd Ark KDE ISO Builder"}
          )
          data = json.loads(urllib.request.urlopen(req, timeout=60).read().decode())
          assets = [a for a in data.get("assets", [])
                    if a["name"].endswith(".pkg.tar.zst") and "debug" not in a["name"]]
          if len(assets) != 1:
              raise SystemExit(f"Expected one ark-backgrounds package, found {len(assets)}")
          print(assets[0]["browser_download_url"])
          PY

      - name: Restore pacman package cache
        uses: actions/cache@v4
        with:
          path: pacman-cache/
          key: ${{ runner.os }}-pacman-lyd-ark-kde-iso-${{ hashFiles('.github/workflows/archiso/packages.x86_64') }}
          restore-keys: |
            ${{ runner.os }}-pacman-lyd-ark-kde-iso-

      - name: Prepare cache directory
        run: mkdir -p pacman-cache

      - name: Build bootable KDE Plasma ISO
        run: |
          chmod +x .github/workflows/build_iso.sh
          sudo podman run --rm --privileged \
            -v "$(pwd):/work" \
            -v "$(pwd)/pacman-cache:/var/cache/pacman/pkg" \
            -w /work docker.io/archlinux:latest \
            bash /work/.github/workflows/build_iso.sh
          sudo chown -R "$USER:$USER" out/ pacman-cache/
          ISO=$(find out -maxdepth 1 -type f -name '*.iso' -print -quit)
          test -n "$ISO"
          mv "$ISO" out/lyd-ark-kde-installer.iso
          test -s out/lyd-ark-kde-installer.iso
          file out/lyd-ark-kde-installer.iso

      - name: Package ISO for release
        id: package-iso
        run: |
          set -euo pipefail
          mkdir -p release-assets
          ISO=out/lyd-ark-kde-installer.iso
          SIZE=$(stat -c '%s' "$ISO")
          # Keep release assets comfortably below GitHub's 2 GiB per-asset ceiling.
          LIMIT=$((1900 * 1024 * 1024))
          if [ "$SIZE" -le "$LIMIT" ]; then
            echo "ISO is $SIZE bytes; uploading as one file."
            cp "$ISO" release-assets/lyd-ark-kde-installer.iso
            echo "is-split=false" >> "$GITHUB_OUTPUT"
          else
            echo "ISO is $SIZE bytes; splitting into release-sized parts."
            split --bytes=1900M --numeric-suffixes=1 --suffix-length=3 \
              --additional-suffix=.part "$ISO" \
              release-assets/lyd-ark-kde-installer.iso.part
            cp .github/workflows/recombine-iso.sh release-assets/recombine-iso.sh
            echo "is-split=true" >> "$GITHUB_OUTPUT"
          fi
          (cd out && sha256sum lyd-ark-kde-installer.iso) > release-assets/SHA256SUMS
          ls -lh release-assets/

      - name: Upload ISO release assets
        uses: actions/upload-artifact@v4
        with:
          name: lyd-ark-kde-installer-iso
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build-iso
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download ISO release assets
        uses: actions/download-artifact@v4
        with:
          name: lyd-ark-kde-installer-iso
          path: release-assets/

      - name: Publish ISO release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lyd-ark-kde-iso-${{ github.sha }}
          name: "Lyd Ark KDE Installer ${{ github.sha }}"
          body: |
            # Lyd Ark KDE Plasma Installer

            This is the Lyd Ark KDE Plasma live installer. Alga installs the Lyd Ark
            bootc image variant selected in the installer.

            The workflow uploads the ISO as a single file whenever it is below the
            configured 1900 MiB safety threshold. Larger ISOs are split into parts.

            ## If the release contains lyd-ark-kde-installer.iso

            Verify it with:

            ```bash
            sha256sum -c SHA256SUMS
            ```

            ## If the release contains .part files

            Download every `lyd-ark-kde-installer.iso.partNNN.part` file, `SHA256SUMS`,
            and `recombine-iso.sh` into one directory, then run:

            ```bash
            chmod +x recombine-iso.sh
            ./recombine-iso.sh
            ```

            The script joins the parts and verifies the resulting ISO with SHA-256.

            ## Write to USB

            ```bash
            sudo dd if=lyd-ark-kde-installer.iso of=/dev/sdX bs=4M status=progress conv=fsync
            ```

            Replace `/dev/sdX` with the correct USB device.
          files: release-assets/*
          prerelease: false
          make_latest: true
