name: Build KDE Ark Installer ISO

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: ark-iso-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      aur-release-id: ${{ steps.aur.outputs.release-id }}
      alga-url: ${{ steps.alga.outputs.url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check published ark-aur release
        id: aur
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/workflows/download-aur-release.py --kind identity
      - name: Check published Alga fork release
        id: alga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATA=$(gh api repos/lydiaperspective/lyd-agka/releases/latest)
          ID=$(printf '%s' "$DATA" | jq -er '.id')
          URL=$(printf '%s' "$DATA" | jq -er '[.assets[] | select(.name | endswith(".pkg.tar.zst")) | select(.name | contains("-debug-") | not)] | if length == 1 then .[0].browser_download_url else error("Expected exactly one Alga package asset") end')
          echo "release-id=$ID" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  build-iso:
    needs: check-releases
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y podman wget curl jq gh

      - name: Wait for current KDE NVIDIA 580 image to publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXPECTED=$(gh api repos/lydiaperspective/lyd-ark-image/commits/main --jq '.sha')
          STATE=pending
          for attempt in $(seq 1 60); do
            RUN=$(gh api 'repos/lydiaperspective/lyd-ark-image/actions/workflows/build-payload.yml/runs?branch=main&per_page=1')
            RUN_SHA=$(printf '%s' "$RUN" | jq -r '.workflow_runs[0].head_sha // empty')
            STATE=$(printf '%s' "$RUN" | jq -r '.workflow_runs[0] | if .status == "completed" then .conclusion else .status end')
            if [ "$RUN_SHA" = "$EXPECTED" ] && [ "$STATE" = success ]; then
              echo "Current image-builder commit $EXPECTED completed successfully."
              break
            fi
            if [ "$RUN_SHA" = "$EXPECTED" ] && [[ "$STATE" =~ ^(failure|cancelled|timed_out|action_required|stale)$ ]]; then
              echo "Image build for $EXPECTED failed: $STATE" >&2
              exit 1
            fi
            echo "Waiting for KDE image build ($attempt/60): run=$RUN_SHA state=$STATE expected=$EXPECTED"
            sleep 30
          done
          [ "$RUN_SHA" = "$EXPECTED" ] && [ "$STATE" = success ] || {
            echo "Timed out waiting for the latest KDE image build." >&2
            exit 1
          }

      - name: Verify installer image is pullable
        run: |
          sudo podman pull ghcr.io/lydiaperspective/lyd-ark-image:ark-nvidia-580

      - name: Download AUR packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/workflows/download-aur-release.py --kind packages \
            --release-id '${{ needs.check-releases.outputs.aur-release-id }}' \
            --destination aur-packages

      - name: Download Alga installer package
        env:
          PACKAGE_URL: ${{ needs.check-releases.outputs.alga-url }}
        run: curl -fL --retry 3 --connect-timeout 15 --max-time 300 "$PACKAGE_URL" -o aur-packages/alga.pkg.tar.zst

      - name: Download ark-backgrounds package
        run: |
          cd aur-packages
          python3 << 'PY' | wget -qi -
          import json
          import urllib.request
          req = urllib.request.Request(
              "https://api.github.com/repos/zamkara/ark-backgrounds/releases/latest",
              headers={"User-Agent": "Ark KDE ISO Builder"}
          )
          data = json.loads(urllib.request.urlopen(req, timeout=60).read().decode())
          assets = [a for a in data.get("assets", [])
                    if a["name"].endswith(".pkg.tar.zst") and "debug" not in a["name"]]
          if len(assets) != 1:
              raise SystemExit(f"Expected one ark-backgrounds package, found {len(assets)}")
          print(assets[0]["browser_download_url"])
          PY

      - name: Restore pacman package cache
        uses: actions/cache@v4
        with:
          path: pacman-cache/
          key: ${{ runner.os }}-pacman-kde-iso-${{ hashFiles('.github/workflows/archiso/packages.x86_64') }}
          restore-keys: |
            ${{ runner.os }}-pacman-kde-iso-

      - name: Prepare cache directory
        run: mkdir -p pacman-cache

      - name: Build bootable KDE Plasma ISO
        run: |
          chmod +x .github/workflows/build_iso.sh
          sudo podman run --rm --privileged \
            -v "$(pwd):/work" \
            -v "$(pwd)/pacman-cache:/var/cache/pacman/pkg" \
            -w /work docker.io/archlinux:latest \
            bash /work/.github/workflows/build_iso.sh
          sudo chown -R "$USER:$USER" out/ pacman-cache/
          ISO=$(find out -maxdepth 1 -type f -name '*.iso' -print -quit)
          test -n "$ISO"
          mv "$ISO" out/ark-installer.iso
          test -s out/ark-installer.iso
          file out/ark-installer.iso

      - name: Split ISO into GitHub-release-sized parts
        run: |
          mkdir -p release-assets
          split --bytes=1900M --numeric-suffixes=1 --suffix-length=3 \
            --additional-suffix=.part out/ark-installer.iso \
            release-assets/ark-installer.iso.part
          cp .github/workflows/recombine-iso.sh release-assets/recombine-iso.sh
          (cd out && sha256sum ark-installer.iso) > release-assets/SHA256SUMS
          ls -lh release-assets/

      - name: Upload split ISO parts
        uses: actions/upload-artifact@v4
        with:
          name: ark-kde-installer-iso-parts
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build-iso
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download ISO release assets
        uses: actions/download-artifact@v4
        with:
          name: ark-kde-installer-iso-parts
          path: release-assets/

      - name: Publish ISO release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kde-iso-${{ github.sha }}
          name: "Ark KDE Installer ${{ github.sha }}"
          body: |
            # Ark Linux KDE Plasma Installer

            This ISO installs the **ark-nvidia-580** image built from the
            `lydiaperspective/lyd-ark-image` repository.

            The ISO is split into parts to stay below GitHub's per-asset size limit.

            ## Recombine on Linux

            Download all `ark-installer.iso.partNNN.part` files,
            `SHA256SUMS`, and `recombine-iso.sh` into one directory, then run:

            ```bash
            chmod +x recombine-iso.sh
            ./recombine-iso.sh
            ```

            The script joins the parts and verifies the resulting ISO with SHA-256.

            ## Write to USB

            ```bash
            sudo dd if=ark-installer.iso of=/dev/sdX bs=4M status=progress conv=fsync
            ```

            Replace `/dev/sdX` with the correct USB device.
          files: release-assets/*
          prerelease: false
          make_latest: true
