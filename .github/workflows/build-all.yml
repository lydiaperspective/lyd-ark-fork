name: Build All Lyd Ark Images

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner used for the image-variant build
        type: choice
        required: true
        default: github-hosted
        options:
          - github-hosted
          - self-hosted

concurrency:
  group: lyd-ark-image-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-image-variants:
    name: Build and publish all seven image variants
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out orchestrator
        uses: actions/checkout@v6
      - name: Dispatch complete image build and wait
        env:
          ARK_WORKFLOW_TOKEN: ${{ secrets.ARK_WORKFLOW_TOKEN }}
        run: |
          python3 .github/workflows/dispatch-and-wait.py \
            --repo lydiaperspective/lyd-ark-image \
            --workflow build-payload.yml \
            --inputs '{"force":true,"runner":"${{ inputs.runner }}"}'

      - name: Report published image variants
        run: |
          {
            echo "## Lyd Ark image build completed"
            echo
            echo "- `intel-modern`"
            echo "- `intel-modern-apex`"
            echo "- `ark-nvidia-open`"
            echo "- `ark-apex-nvidia-open`"
            echo "- `ark-nvidia-580`"
            echo "- `ark-apex-nvidia-580`"
            echo "- `intel3-server-lts`"
          } >> "$GITHUB_STEP_SUMMARY"
